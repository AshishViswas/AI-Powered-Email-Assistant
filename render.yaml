services:
  - type: web
    name: gmail-agent-api
    runtime: python
    # Demo/portfolio deployment. Render Free services use an ephemeral
    # filesystem, so SQLite data may be lost when the service is recreated.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FASTAPI_BACKEND_URL
        sync: false
      - key: STREAMLIT_URL
        sync: false
      - key: FERNET_SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./gmail.db
      - key: SYNC_INTERVAL_SECONDS
        value: "600"
      - key: UI_REFRESH_SECONDS
        value: "20"
      - key: ENV
        value: production